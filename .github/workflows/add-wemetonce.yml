name: Add WeMetOnce catalog entry

on:
  push:
    branches:
      - add-wemetonce

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add WeMetOnce to marketplace
        env:
          PLUGIN_SHA: 55bf34a86beed99180f39dd0b67ab565ba041225
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('.grok-plugin/marketplace.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          plugins = data.setdefault('plugins', [])

          entry = {
              'name': 'wemetonce',
              'description': 'Find people from your past and reconnect through approved public WeMetOnce Lost Connection posts.',
              'category': 'communication',
              'source': {
                  'source': 'url',
                  'url': 'https://github.com/devworksarav/wemetonce-grok-plugin.git',
                  'sha': '55bf34a86beed99180f39dd0b67ab565ba041225'
              },
              'homepage': 'https://www.wemetonce.com/',
              'keywords': ['wemetonce', 'lost connection', 'find someone from your past', 'reconnect'],
              'domains': ['wemetonce.com', 'www.wemetonce.com']
          }

          existing = next((p for p in plugins if p.get('name') == 'wemetonce'), None)
          if existing is None:
              plugins.append(entry)
          else:
              existing.clear()
              existing.update(entry)

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Regenerate plugin index
        run: python3 scripts/generate-plugin-index.py

      - name: Validate catalog
        run: python3 scripts/validate-catalog.py

      - name: Commit generated changes and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-wemetonce.yml
          git add .grok-plugin/marketplace.json .grok-plugin/plugin-index.json
          git commit -m "Add WeMetOnce to plugin marketplace"
          git push origin HEAD:add-wemetonce
